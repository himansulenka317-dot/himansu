<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Management System</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
    color: #222;
}

/* Sidebar */
.sidebar {
    position: fixed;
    width: 240px;
    height: 100vh;
    background: #172554;
    color: white;
    padding: 25px 15px;
}

.sidebar h2 {
    text-align: center;
    margin-bottom: 35px;
}

.sidebar button {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: white;
    text-align: left;
    cursor: pointer;
    font-size: 15px;
}

.sidebar button:hover {
    background: #2563eb;
}

/* Main */
.main {
    margin-left: 240px;
    padding: 30px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    color: #172554;
}

.btn {
    border: none;
    padding: 11px 18px;
    border-radius: 7px;
    cursor: pointer;
    color: white;
    background: #2563eb;
}

.btn:hover {
    background: #1d4ed8;
}

/* Cards */
.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.card h3 {
    color: #64748b;
    font-size: 15px;
}

.card p {
    font-size: 30px;
    font-weight: bold;
    color: #2563eb;
    margin-top: 10px;
}

/* Table */
.table-box {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

.table-top {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.search {
    width: 250px;
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 7px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 13px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

th {
    background: #eff6ff;
    color: #172554;
}

.edit {
    background: #f59e0b;
    color: white;
    border: none;
    padding: 7px 12px;
    border-radius: 5px;
    cursor: pointer;
}

.delete {
    background: #ef4444;
    color: white;
    border: none;
    padding: 7px 12px;
    border-radius: 5px;
    cursor: pointer;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    width: 450px;
    padding: 30px;
    border-radius: 12px;
}

.modal-content h2 {
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 11px;
    border: 1px solid #ddd;
    border-radius: 6px;
}

.form-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.cancel {
    background: #64748b;
}

/* Responsive */
@media(max-width: 800px) {
    .sidebar {
        width: 180px;
    }

    .main {
        margin-left: 180px;
    }

    .cards {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>🎓 StudentMS</h2>

    <button onclick="showDashboard()">🏠 Dashboard</button>
    <button onclick="openModal()">➕ Add Student</button>
    <button onclick="focusSearch()">🔍 Search Students</button>
</div>

<!-- Main -->
<div class="main">

    <div class="header">
        <h1>Student Management System</h1>

        <button class="btn" onclick="openModal()">
            + Add Student
        </button>
    </div>

    <!-- Dashboard Cards -->
    <div class="cards">

        <div class="card">
            <h3>Total Students</h3>
            <p id="totalStudents">0</p>
        </div>

        <div class="card">
            <h3>Total Courses</h3>
            <p id="totalCourses">0</p>
        </div>

        <div class="card">
            <h3>System Status</h3>
            <p style="color:#16a34a;">Active</p>
        </div>

    </div>

    <!-- Table -->
    <div class="table-box">

        <div class="table-top">

            <h2>Student Records</h2>

            <input
                id="searchInput"
                class="search"
                type="text"
                placeholder="Search student..."
                onkeyup="displayStudents()"
            >

        </div>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Course</th>
                    <th>Age</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTable"></tbody>

        </table>

    </div>

</div>


<!-- Modal -->
<div class="modal" id="studentModal">

    <div class="modal-content">

        <h2 id="modalTitle">Add Student</h2>

        <form id="studentForm">

            <input type="hidden" id="editId">

            <div class="form-group">
                <label>Student Name</label>
                <input id="name" type="text" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input id="email" type="email" required>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input id="phone" type="text" required>
            </div>

            <div class="form-group">
                <label>Course</label>

                <select id="course" required>
                    <option value="">Select Course</option>
                    <option>BCA</option>
                    <option>B.Tech</option>
                    <option>MCA</option>
                    <option>MBA</option>
                    <option>B.Sc</option>
                    <option>Computer Science</option>
                </select>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input id="age" type="number" min="1" max="100" required>
            </div>

            <div class="form-buttons">

                <button class="btn" type="submit">
                    Save Student
                </button>

                <button
                    type="button"
                    class="btn cancel"
                    onclick="closeModal()">
                    Cancel
                </button>

            </div>

        </form>

    </div>

</div>


<script>

let students = JSON.parse(localStorage.getItem("students")) || [];

let editingId = null;


/* Display Students */
function displayStudents() {

    const table = document.getElementById("studentTable");

    const search =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    table.innerHTML = "";

    const filtered = students.filter(student =>
        student.name.toLowerCase().includes(search) ||
        student.email.toLowerCase().includes(search) ||
        student.course.toLowerCase().includes(search)
    );

    filtered.forEach(student => {

        const row = document.createElement("tr");

        row.innerHTML = `

            <td>${student.id}</td>

            <td>${student.name}</td>

            <td>${student.email}</td>

            <td>${student.phone}</td>

            <td>${student.course}</td>

            <td>${student.age}</td>

            <td>

                <button
                    class="edit"
                    onclick="editStudent(${student.id})">
                    Edit
                </button>

                <button
                    class="delete"
                    onclick="deleteStudent(${student.id})">
                    Delete
                </button>

            </td>

        `;

        table.appendChild(row);
    });

    updateDashboard();
}


/* Add / Edit Student */
document
.getElementById("studentForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    const name =
        document.getElementById("name").value;

    const email =
        document.getElementById("email").value;

    const phone =
        document.getElementById("phone").value;

    const course =
        document.getElementById("course").value;

    const age =
        document.getElementById("age").value;


    if(editingId !== null) {

        const student =
            students.find(s => s.id === editingId);

        student.name = name;
        student.email = email;
        student.phone = phone;
        student.course = course;
        student.age = age;

        editingId = null;

    } else {

        const student = {

            id:
                students.length > 0
                ? Math.max(...students.map(s => s.id)) + 1
                : 1,

            name,
            email,
            phone,
            course,
            age
        };

        students.push(student);
    }


    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );

    closeModal();

    displayStudents();

    this.reset();

});


/* Edit */
function editStudent(id) {

    const student =
        students.find(s => s.id === id);

    if(!student) return;

    editingId = id;

    document.getElementById("modalTitle")
        .innerText = "Edit Student";

    document.getElementById("name")
        .value = student.name;

    document.getElementById("email")
        .value = student.email;

    document.getElementById("phone")
        .value = student.phone;

    document.getElementById("course")
        .value = student.course;

    document.getElementById("age")
        .value = student.age;

    document.getElementById("studentModal")
        .style.display = "flex";
}


/* Delete */
function deleteStudent(id) {

    if(!confirm("Are you sure you want to delete this student?"))
        return;

    students =
        students.filter(s => s.id !== id);

    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );

    displayStudents();
}


/* Open Modal */
function openModal() {

    editingId = null;

    document.getElementById("modalTitle")
        .innerText = "Add Student";

    document.getElementById("studentForm")
        .reset();

    document.getElementById("studentModal")
        .style.display = "flex";
}


/* Close Modal */
function closeModal() {

    document.getElementById("studentModal")
        .style.display = "none";

    document.getElementById("studentForm")
        .reset();

    editingId = null;
}


/* Search */
function focusSearch() {

    document.getElementById("searchInput")
        .focus();
}


/* Dashboard */
function updateDashboard() {

    document.getElementById("totalStudents")
        .innerText = students.length;

    const courses =
        new Set(students.map(s => s.course));

    document.getElementById("totalCourses")
        .innerText = courses.size;
}


function showDashboard() {
    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* Initial Load */
displayStudents();

</script>

</body>
</html>
